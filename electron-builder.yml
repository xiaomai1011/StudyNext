appId: com.studynext.desktop
productName: StudyNext
copyright: Copyright © 2026 StudyNext Contributors
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/tray.png
    to: tray.png
  - from: resources/icon.png
    to: icon.png
asar: true
win:
  executableName: StudyNext
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: StudyNext
  artifactName: StudyNext-Setup-${version}.${ext}
  uninstallDisplayName: StudyNext
  include: build/installer.nsh
npmRebuild: false
publish: null
